<ion-header>
  <ion-toolbar>
    <ion-title>update-password</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-item>
    <ion-label position="floating">Nueva contraseña</ion-label>
    <ion-input type="password" [(ngModel)]="newPassword"></ion-input>
  </ion-item>
  <ion-button expand="block" (click)="updatePassword()">Actualizar</ion-button>
</ion-content>
